name: zizmor

# Static analysis of this repo's GitHub Actions workflows (unpinned actions,
# overly broad permissions, template injection, cache poisoning, etc.).
# https://docs.zizmor.sh/
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # advanced-security: false prints findings to the job log and fails
      # the job on any finding, instead of uploading SARIF to the Security
      # tab (which needs security-events: write and GitHub Advanced
      # Security on private repos).
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
