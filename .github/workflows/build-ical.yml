name: Build and deploy ical feeds

# Regenerates the .ics calendars from the vendor API (see
# scripts/build-ical.js) and publishes them to Cloudflare Pages. Runs daily
# since the district can revise a menu at any time, plus workflow_dispatch
# for manual runs/testing.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest-month: ${{ steps.coverage.outputs.latest-month }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          # No dependency cache: this job publishes to Cloudflare, so a
          # poisoned cache could end up in a deploy (zizmor cache-poisoning).
          # Explicit because setup-node v5+ caches automatically otherwise.
          package-manager-cache: false

      - run: npm ci

      - run: npm run build-ical

      - id: coverage
        run: echo "latest-month=$(jq -r .latestMonth dist/ical/coverage.json)" >> "$GITHUB_OUTPUT"

      # TODO(jay): create the "lindbergh-school-menus-unofficial" Cloudflare
      # Pages project, then add the two repo secrets (Settings -> Secrets
      # and variables -> Actions):
      #   CLOUDFLARE_API_TOKEN   - a token with Cloudflare Pages:Edit
      #   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ical --project-name=lindbergh-school-menus-unofficial

  # Commits refreshed README badges (scripts/update-readme-badges.js) when
  # they change - at least monthly, which also keeps this scheduled workflow
  # from being auto-disabled after 60 days without repository activity.
  # Separate job so the deploy key is never present while npm ci runs
  # third-party install scripts.
  #
  # Pushes with a deploy key rather than GITHUB_TOKEN because the main
  # ruleset requires the zizmor check; the deploy key is on the ruleset's
  # bypass list. Setup (one-time):
  #   ssh-keygen -t ed25519 -N "" -C readme-badge-bot -f readme-badge-bot
  #   Settings -> Deploy keys -> add readme-badge-bot.pub, allow write access
  #   Settings -> Secrets and variables -> Actions -> README_DEPLOY_KEY =
  #     contents of readme-badge-bot (the private key); then delete both files
  #   Settings -> Rules -> the main ruleset -> Bypass list -> Deploy keys
  update-readme-badges:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Credentials must persist so the push below can use the key; this job
      # uploads no artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.README_DEPLOY_KEY }} # zizmor: ignore[artipacked]

      - name: Update badges
        env:
          LATEST_MONTH: ${{ needs.build-and-deploy.outputs.latest-month }}
        run: |
          printf '{"latestMonth":"%s"}' "$LATEST_MONTH" > "$RUNNER_TEMP/coverage.json"
          node scripts/update-readme-badges.js "$RUNNER_TEMP/coverage.json"

      # [skip ci]: a README-only change doesn't need the Pages deploy or
      # zizmor runs that a push to main would otherwise trigger.
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update README menu badges [skip ci]" README.md
          git push
