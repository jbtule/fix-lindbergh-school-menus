name: Build and deploy ical feeds

# Regenerates the .ics calendars from the vendor API (see
# scripts/build-ical.js) and publishes them to Cloudflare Pages. Runs daily
# since the district can revise a menu at any time, plus workflow_dispatch
# for manual runs/testing.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          # No dependency cache: this job publishes to Cloudflare, so a
          # poisoned cache could end up in a deploy (zizmor cache-poisoning).
          # Explicit because setup-node v5+ caches automatically otherwise.
          package-manager-cache: false

      - run: npm ci

      - run: npm run build-ical

      # TODO(jay): create the "lindbergh-school-menus-unofficial" Cloudflare
      # Pages project, then add the two repo secrets (Settings -> Secrets
      # and variables -> Actions):
      #   CLOUDFLARE_API_TOKEN   - a token with Cloudflare Pages:Edit
      #   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
      - uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ical --project-name=lindbergh-school-menus-unofficial
