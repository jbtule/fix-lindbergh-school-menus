name: Deploy GitHub Pages

# Replaces the old Jekyll-based "deploy from a branch" GitHub Pages setup
# with an Actions-based one. There's nothing Jekyll-y about this site (no
# _config.yml, no templating) beyond one Liquid tag it relied on for the
# footer's commit-SHA badge (site.github.build_revision, auto-populated by
# the legacy build) - rather than run a full Jekyll build just for that one
# substitution, index.html now carries __BUILD_SHA__/__BUILD_SHA_SHORT__
# placeholders that this workflow fills in itself. Requires the repo's
# Settings -> Pages -> Build and deployment -> Source to be set to "GitHub
# Actions" (one-time, not something this workflow can do for itself).
#
# Cache-busting (the ?v= query strings and version.js - see
# checkForUpdate() in app.js) used to be a git pre-commit hook, computed at
# commit time and baked into committed files; that only worked if a
# contributor remembered to activate it. Moved here instead, same idea as
# __BUILD_SHA__ above: computed fresh on the staged copy right before
# deploy, so it's simply always correct. The committed source's ?v=dead
# placeholders are meaningless - only what this workflow produces matters.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel one that's already
# live-deploying (a half-applied deploy is worse than a queued one).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copies every tracked file except the ical-cron/dev-tooling ones
      # (scripts/build-ical.js, package.json, this .github/ directory,
      # etc.) - those have nothing to do with the web app and shouldn't end
      # up served from the site root. Update this pattern if a new
      # top-level dev-only file/folder is added.
      - name: Stage site files
        run: |
          mkdir -p _site
          git ls-files | grep -vE '^(\.github/|\.gitignore$|package(-lock)?\.json$|scripts/|README\.md$)' | while read -r f; do
            mkdir -p "_site/$(dirname "$f")"
            cp "$f" "_site/$f"
          done

      - name: Inject build revision
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          sed -i "s/__BUILD_SHA_SHORT__/$short_sha/g; s/__BUILD_SHA__/$GITHUB_SHA/g" _site/index.html

      # Same technique the old hooks/pre-commit used locally, just run here
      # instead: rewrite app.js's own import specifiers first (its hash
      # must reflect their final ?v=), then app.js/style.css/
      # station-boundaries.js's <script> tags in index.html, then write a
      # version.js whose hash covers all of the above.
      - name: Cache-bust and set version
        working-directory: _site
        run: |
          hash_of() { shasum -a 256 "$1" | cut -c1-8; }

          bust() { # rewrites <script src="FILE?v=...">/<link href="FILE?v=...."> in index.html
            sed -E -i "s#(\"$1)(\?v=[^\"]*)?\"#\1?v=$2\"#" index.html
          }
          bust_in() { # rewrites import "./MODULE?v=..." inside TARGET
            sed -E -i "s#(\"\./$2)(\?v=[^\"]*)?\"#\1?v=$3\"#" "$1"
          }

          OPTIONAL_FILES="station-boundaries.js"

          bust_in app.js config.js "$(hash_of config.js)"
          bust_in app.js menu-api.js "$(hash_of menu-api.js)"
          bust_in app.js ical-naming.js "$(hash_of ical-naming.js)"

          bust app.js "$(hash_of app.js)"
          bust style.css "$(hash_of style.css)"
          for f in $OPTIONAL_FILES; do
            [ -f "$f" ] && bust "$f" "$(hash_of "$f")"
          done

          version_inputs="app.js config.js style.css menu-api.js ical-naming.js"
          for f in $OPTIONAL_FILES; do
            [ -f "$f" ] && version_inputs="$version_inputs $f"
          done
          version=$(cat $version_inputs | shasum -a 256 | cut -c1-8)
          # Not a heredoc: its closing delimiter would have to sit at column
          # 0 to be recognized, which YAML's indented block-scalar syntax
          # can't produce here.
          {
            echo "// Generated by .github/workflows/deploy-pages.yml at deploy time."
            echo "const APP_VERSION = \"$version\";"
          } > version.js
          bust version.js "$version"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
